spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: api-gateway
            client-secret: api-gateway-secret-change-me
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            authorization-uri: http://keycloak:8080/realms/sber-realm/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/sber-realm/protocol/openid-connect/token
            user-info-uri: http://keycloak:8080/realms/sber-realm/protocol/openid-connect/userinfo
            jwk-set-uri: http://keycloak:8080/realms/sber-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    ru.sber: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
  logstash:
    encoder:
      destination: localhost:5000